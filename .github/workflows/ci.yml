# GitHub Actions CI — 2026-07-25 新增（修 P0 质量门）
# 之前仓库无 CI，9 个 error + 19 个 warning 全靠人眼发现。
# 现在 PR/push 自动串行跑 backend 两层 pytest + frontend lint/typecheck/build。
# 任何一步失败直接红 X，main 分支不允许合入。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # engine/agents/writer.py 使用 PEP 701 f-string；Python 3.12 是最低版本。
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      # 两层共享 SQLite/日志资源，必须在同一 job 中串行；并行会产生锁争用和假失败。
      - name: Invariant tests
        run: python -m pytest backend/tests/invariants -q
      - name: Behavior tests
        run: python -m pytest backend/tests --ignore=backend/tests/invariants -q
      - name: Compile check
        run: python -m compileall -q backend/app backend/engine backend/scripts backend/tests
      - name: Ruff (changed files only)
        # 历史代码已有 1000+ style 警告，不在 CI 拦；只对本次 PR 改动文件跑 ruff
        # 保证新代码风格不漂移，老代码未来按 PR 逐步收敛
        run: |
          pip install ruff==0.6.9
          CHANGED=$(git diff --name-only origin/${GITHUB_BASE_REF:-main}...HEAD 2>/dev/null | grep '^backend/.*\.py$' || true)
          if [ -n "$CHANGED" ]; then
            echo "Linting changed files:"
            echo "$CHANGED"
            echo "$CHANGED" | xargs ruff check --config backend/pyproject.toml
          else
            echo "No backend .py files changed in this PR."
          fi

  frontend-checks:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Lint (max-warnings 50)
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        # typecheck 已单独执行；这里避免 tsc -b 重复编译一次。
        run: npm run build:vite
